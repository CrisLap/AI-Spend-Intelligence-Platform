version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # react-i18next 18 needs i18next >= 27, while the project is on i18next 26,
    # so its Dependabot PR fails `npm ci` with ERESOLVE (and 18's types also
    # need a small ChatPage.tsx fix). Skip the major until i18next is upgraded
    # to 27 together with it, then remove this block.
    ignore:
      - dependency-name: "react-i18next"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    # Only propose patch-level bumps of the Python base image (e.g.
    # 3.12.1 -> 3.12.2) automatically. A minor/major Python version jump
    # (e.g. 3.14 -> 3.15) changes the site-packages path hardcoded in the
    # Dockerfile's multi-stage COPY and can silently break compiled
    # dependencies (psycopg, numpy, Pillow, etc.) that don't yet have
    # wheels for a brand-new interpreter - worth a human looking at the
    # Dockerfile and requirements.txt together, not an automatic merge.
    # See the 2026-11-15 incident this was added after (backend/Dockerfile
    # git history) for the concrete failure mode.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
