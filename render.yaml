services:
  - type: web
    name: ai-spend-intelligence-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://ai-spend-intelligence-platform.vercel.app
      - key: SECRET_KEY
        generateValue: true
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: spend_documents
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-20b
      - key: JINA_API_KEY
        sync: false
      - key: JINA_EMBED_MODEL
        value: jina-embeddings-v3
      - key: OLLAMA_HOST
        value: ""

# NOTA SUL DEPLOY A COSTO ZERO
# - plan "free": il servizio va in sleep dopo ~15 min di inattivita' e si
#   riattiva alla richiesta successiva (30-60s di cold start). Normale su
#   piano gratuito, nessuna azione richiesta.
# - Postgres NON e' definito qui: Render Postgres free scade dopo 90 giorni.
#   Si consiglia un provider Postgres gratuito "per sempre" (es. Neon o
#   Supabase) e incollare la connection string in DATABASE_URL come Secret.
# - Qdrant NON e' self-hosted su Render (i servizi "pserv" sono a pagamento
#   anche minimi). Usare un cluster gratuito su Qdrant Cloud (1GB free
#   forever) e incollare URL + API key in QDRANT_URL / QDRANT_API_KEY.
# - Ollama non e' utilizzabile gratuitamente in produzione su Render (niente
#   GPU, RAM insufficiente sul piano free). OLLAMA_HOST viene lasciato vuoto
#   cosi' il backend salta automaticamente al fallback Groq (gratuito, via
#   GROQ_API_KEY). Ollama resta comunque attivo per lo sviluppo in locale.
# - Gli embeddings (ricerca semantica/RAG) usano lo stesso pattern con Jina AI
#   (free tier, via JINA_API_KEY), dato che Groq non offre un endpoint
#   embeddings. Senza questa chiave si degrada a un hash pseudo-embedding.
# - CORS_ORIGINS usa "value" (non "sync: false"): Render tratta questo file
#   come sorgente di verita' per le chiavi "value" e le ri-applica ad ogni
#   deploy che risincronizza il Blueprint, sovrascrivendo silenziosamente
#   qualunque valore diverso impostato a mano nella dashboard. Va quindi
#   mantenuto qui aggiornato con il dominio Vercel reale, non lasciato come
#   placeholder, altrimenti un deploy futuro puo' ripristinare
#   "your-frontend.vercel.app" e rompere il CORS in produzione.
